<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Criar Ticket</title>
  <link rel="stylesheet" href="ticket.css">
</head>
<body>
  <div class="container">
    <h2 class="titulo">Novo Ticket</h2>

    <input type="text" placeholder="Informe o título do caso" class="campo">

    <select class="campo">
      <option disabled selected>Selecione a categoria</option>
      <option>Suporte Técnico</option>
      <option>Financeiro</option>
      <option>Outro</option>
    </select>

    <textarea placeholder="Descreva seu caso" class="campo descricao"></textarea>

    <button class="enviar">Enviar</button>
  </div>
</body>
</html>
